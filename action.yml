name: 'Version Check'
description: 'Check version changes in any file format (JSON, YAML, TOML, plist, Xcode project.xcproj, XcodeGen project.yml)'
author: 'rxliuli'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  file:
    description: 'Path to the file to check (e.g., ./package.json, ./Cargo.toml, ./MyApp.xcodeproj/project.xcproj, ./project.yml)'
    required: true
  query:
    description: >
      Dot-notation path to the version field (e.g., "version", "package.version",
      "build-settings.MARKETING_VERSION", "settings.base.MARKETING_VERSION"). "*" matches any key.
      Defaults to "version" for JSON/YAML/TOML/plist files and to the MARKETING_VERSION build
      setting for Xcode project.xcproj and XcodeGen project.yml files.
    required: false
    default: ''
  format:
    description: >
      File format: auto (default), json, yaml, toml, plist, xcodegen or xcproj. Auto-detected from
      the file name, where *.xcproj/*.xcodeproj means Xcode JSON project format and
      project.yml/project.yaml means an XcodeGen spec.
    required: false
    default: 'auto'
  base:
    description: >
      Base git ref/commit to compare against. Defaults to github.event.before on push,
      github.event.pull_request.base.sha on pull_request, or HEAD~1 otherwise.
    required: false
    default: ''

outputs:
  changed:
    description: 'Whether the version increased (true/false; false on downgrades)'
  version:
    description: 'Current version number'
  previous_version:
    description: 'Previous version number'
  type:
    description: 'Type of version change (major/minor/patch/prerelease/downgrade)'
  path:
    description: 'Path the version was read from (e.g., settings.base.MARKETING_VERSION)'

runs:
  using: 'node24'
  main: 'dist/index.js'
